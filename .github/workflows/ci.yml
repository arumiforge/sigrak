name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg19
        env:
          POSTGRES_USER: sigrak
          POSTGRES_PASSWORD: sigrak
          POSTGRES_DB: sigrak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigrak -d sigrak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json (D-422)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.example .env
          node ace generate:key

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency audit (production, high and critical)
        run: pnpm audit:prod

      - name: Tests (Japa, PostgreSQL 19 + Redis)
        run: pnpm test

      - name: Build
        run: pnpm build
