name: Commit policy

# Arumi Studios is the sole contributor (CLAUDE.md, D-148; Fondasi F-009).
# Rejects commits that are authored by anyone else or that carry AI
# attribution trailers, and pull requests whose title or body carries
# an AI footer. Same pattern as .githooks/commit-msg.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          forbidden='^(co-authored-by:|claude-session:)|generated (with|by) \[?(claude|codex|chatgpt|openai|copilot)|claude\.ai/code|chatgpt\.com/codex|noreply@anthropic\.com'
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qiE "$forbidden"; then
            echo "::error::The pull request title or body contains an AI attribution footer or link. Edit the PR and remove it; this check re-runs on edit."
            exit 1
          fi
          echo "Pull request title and body comply."

      - name: Check commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi

          allowed_author='^(arumiforge@gmail\.com|[0-9]+\+arumiforge@users\.noreply\.github\.com|arumiforge@users\.noreply\.github\.com)$'
          allowed_committer='^(arumiforge@gmail\.com|[0-9]+\+arumiforge@users\.noreply\.github\.com|arumiforge@users\.noreply\.github\.com|noreply@github\.com)$'
          forbidden='^(co-authored-by:|claude-session:)|generated (with|by) \[?(claude|codex|chatgpt|openai|copilot)|claude\.ai/code|chatgpt\.com/codex|noreply@anthropic\.com'

          fail=0
          for c in $(git rev-list "$range"); do
            ae=$(git show -s --format='%ae' "$c")
            ce=$(git show -s --format='%ce' "$c")
            subject=$(git show -s --format='%h %s' "$c")
            if ! [[ "$ae" =~ $allowed_author ]]; then
              echo "::error::$subject — author <$ae> is not Arumi Studios"; fail=1
            fi
            if ! [[ "$ce" =~ $allowed_committer ]]; then
              echo "::error::$subject — committer <$ce> is not Arumi Studios"; fail=1
            fi
            if git show -s --format='%B' "$c" | grep -qiE "$forbidden"; then
              echo "::error::$subject — contains a co-author or AI attribution line"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "All commits in $range comply."
          exit "$fail"
