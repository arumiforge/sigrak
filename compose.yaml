# Local services for development: PostgreSQL 19 (with pgvector, D-398, D-412)
# and Redis. The app itself runs on the host with `npm run dev`.
name: sigrak

services:
    postgres:
        image: pgvector/pgvector:pg19
        environment:
            POSTGRES_USER: sigrak
            POSTGRES_PASSWORD: sigrak
            POSTGRES_DB: sigrak
            TZ: UTC
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            # PostgreSQL 18+ images keep their data under /var/lib/postgresql/<major>/docker.
            - postgres:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U sigrak -d sigrak']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:8.8-alpine
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres:
    redis:
