# pnpm settings (D-422). Only packages listed here as true may run install scripts;
# new package versions must be published for 1 day (1440 minutes) before they are installed.
allowBuilds:
  '@swc/core': false
  # Optional native speed-up for msgpackr (BullMQ); the pure JavaScript fallback is used.
  'msgpackr-extract': false
# Optional dependencies never installed (D-422, D-469).
ignoredOptionalDependencies:
  # Piscina (CPU pool): prebuilt native binaries, loaded only for `niceIncrement`,
  # which the pool leaves at 0. Piscina itself has no install script.
  - '@napi-rs/nice'
minimumReleaseAge: 1440
